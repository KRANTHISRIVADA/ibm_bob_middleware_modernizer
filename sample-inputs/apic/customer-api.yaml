openapi: "3.0.0"
info:
  title: Customer Account API
  version: "1.2.0"
  description: |
    IBM API Connect sample — Customer Account Management API.
    Handles customer CRUD operations with OAuth2 security and backend routing to microservices.
  contact:
    name: Integration Team
    email: integration@example.com

servers:
  - url: https://api.example.com/v1
    description: Production

x-ibm-configuration:
  assembly:
    execute:
      - invoke:
          target-url: https://customers-backend.internal:8080/customers$(request.path)
          verb: keep
  cors:
    enabled: true
  enforced: true

security:
  - OAuth2: [read, write]

paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List all customers
      tags: [Customers]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      security:
        - OAuth2: [read]
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  total: { type: integer }
                  page: { type: integer }
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded

    post:
      operationId: createCustomer
      summary: Create a new customer
      tags: [Customers]
      security:
        - OAuth2: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        "400":
          description: Validation error

  /customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get customer by ID
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - OAuth2: [read]
      responses:
        "200":
          description: Customer record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        "404":
          description: Customer not found

    put:
      operationId: updateCustomer
      summary: Update customer
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - OAuth2: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

    delete:
      operationId: deleteCustomer
      summary: Delete customer
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - OAuth2: [write]
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            read: Read customer data
            write: Create, update, and delete customers

  schemas:
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, firstName, lastName, email, status]

    CustomerInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
      required: [firstName, lastName, email]
